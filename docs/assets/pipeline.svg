<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" role="img" aria-labelledby="p-title p-desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="p-title">The editing pipeline, from raw video to the output folder</title>
  <desc id="p-desc">Eight steps in two rows. Row one: raw video, analyze, takes.md, and the versioned EDL. Row two: preview render, self-evaluation, final render, report and packaging. A dashed arrow goes from the self-evaluation back to the EDL, labelled "fix the EDL, save a new version, up to 3 rounds". Everything ends in the output folder with final.mp4, final-shorts.mp4, capa-1.png, titulo.txt, descricao.txt, capitulos.txt and relatorio.md.</desc>
  <defs>
    <marker id="p-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#64748b"/>
    </marker>
    <marker id="p-arrow-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff5555"/>
    </marker>
  </defs>

  <rect x="8" y="8" width="984" height="624" rx="24" fill="#f8f8f2" stroke="#e2e8f0" stroke-width="2"/>

  <text x="32" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#111827">How an edit flows</text>
  <text x="968" y="58" font-size="14" text-anchor="end" fill="#64748b">Tools are deterministic. Claude Code makes the decisions.</text>

  <!-- row 1 -->
  <g>
    <rect x="32" y="88" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="58" cy="116" r="13" fill="#111827"/>
    <text x="58" y="121" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">1</text>
    <text x="80" y="122" font-size="17" font-weight="700" fill="#111827">Raw video</text>
    <text x="48" y="154" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">inbox/aula.mp4</text>
    <text x="48" y="182" font-size="14" fill="#334155">Any folder works. The</text>
    <text x="48" y="202" font-size="14" fill="#334155">original is never touched.</text>
  </g>
  <g>
    <rect x="272" y="88" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="298" cy="116" r="13" fill="#111827"/>
    <text x="298" y="121" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">2</text>
    <text x="320" y="122" font-size="17" font-weight="700" fill="#111827">Analyze</text>
    <text x="288" y="154" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">mce analyze</text>
    <text x="288" y="182" font-size="14" fill="#334155">720p proxy, word-level</text>
    <text x="288" y="202" font-size="14" fill="#334155">transcript, silences, retakes.</text>
  </g>
  <g>
    <rect x="512" y="88" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="538" cy="116" r="13" fill="#111827"/>
    <text x="538" y="121" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">3</text>
    <text x="560" y="122" font-size="17" font-weight="700" fill="#111827">Read</text>
    <text x="528" y="154" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">analysis/takes.md</text>
    <text x="528" y="182" font-size="14" fill="#334155">The video as text. Claude</text>
    <text x="528" y="202" font-size="14" fill="#334155">reads it and plans the edit.</text>
  </g>
  <g>
    <rect x="752" y="88" width="216" height="140" rx="16" fill="#111827"/>
    <circle cx="778" cy="116" r="13" fill="#ff5555"/>
    <text x="778" y="121" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
    <text x="800" y="122" font-size="17" font-weight="700" fill="#f8f8f2">Write the EDL</text>
    <text x="768" y="154" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#cbd5e1">edl/edl.vN.json</text>
    <text x="768" y="182" font-size="14" fill="#e2e8f0">The single source of truth.</text>
    <text x="768" y="202" font-size="14" fill="#e2e8f0">Versioned, never overwritten.</text>
  </g>
  <path d="M250 158 H268" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>
  <path d="M490 158 H508" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>
  <path d="M730 158 H748" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>

  <!-- EDL down to row 2 -->
  <path d="M830 228 V254 Q830 262 822 262 H148 Q140 262 140 270 V326" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>

  <!-- feedback loop: eval back to the EDL -->
  <path d="M380 330 V304 Q380 296 388 296 H882 Q890 296 890 288 V234" stroke="#ff5555" stroke-width="2" stroke-dasharray="7 6" fill="none" marker-end="url(#p-arrow-coral)"/>
  <rect x="458" y="283" width="356" height="26" rx="13" fill="#f8f8f2"/>
  <text x="636" y="301" font-size="14" font-weight="700" text-anchor="middle" fill="#ff5555">fix the EDL, save v(N+1) · up to 3 rounds</text>

  <!-- row 2 -->
  <g>
    <rect x="32" y="330" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="58" cy="358" r="13" fill="#111827"/>
    <text x="58" y="363" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">5</text>
    <text x="80" y="364" font-size="17" font-weight="700" fill="#111827">Render a preview</text>
    <text x="48" y="396" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">mce render</text>
    <text x="48" y="424" font-size="14" fill="#334155">ffmpeg cuts, Remotion draws</text>
    <text x="48" y="444" font-size="14" fill="#334155">graphics, ffmpeg composes.</text>
  </g>
  <g>
    <rect x="272" y="330" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="298" cy="358" r="13" fill="#111827"/>
    <text x="298" y="363" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">6</text>
    <text x="320" y="364" font-size="17" font-weight="700" fill="#111827">Self-evaluate</text>
    <text x="288" y="396" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">mce eval</text>
    <text x="288" y="424" font-size="14" fill="#334155">Measures the rendered file:</text>
    <text x="288" y="444" font-size="14" fill="#334155">cuts, loudness, caption sync.</text>
  </g>
  <g>
    <rect x="512" y="330" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="538" cy="358" r="13" fill="#111827"/>
    <text x="538" y="363" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">7</text>
    <text x="560" y="364" font-size="17" font-weight="700" fill="#111827">Render the final</text>
    <text x="528" y="396" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">mce render --final</text>
    <text x="528" y="424" font-size="14" fill="#334155">1080p from the original</text>
    <text x="528" y="444" font-size="14" fill="#334155">file, then evaluated again.</text>
  </g>
  <g>
    <rect x="752" y="330" width="216" height="140" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="778" cy="358" r="13" fill="#111827"/>
    <text x="778" y="363" font-size="14" font-weight="700" text-anchor="middle" fill="#f8f8f2">8</text>
    <text x="800" y="364" font-size="17" font-weight="700" fill="#111827">Report and pack</text>
    <text x="768" y="396" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#475569">mce report · mce pack</text>
    <text x="768" y="424" font-size="14" fill="#334155">Chapters, edit report,</text>
    <text x="768" y="444" font-size="14" fill="#334155">thumbnail, title, description.</text>
  </g>
  <path d="M250 400 H268" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>
  <path d="M490 400 H508" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>
  <path d="M730 400 H748" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>
  <path d="M860 470 V502" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#p-arrow)"/>

  <!-- output -->
  <rect x="32" y="506" width="936" height="102" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <circle cx="58" cy="536" r="13" fill="#34d399"/>
  <path d="M51.5 536.5 L56 541 L64.5 531.5" stroke="#111827" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="80" y="542" font-size="17" font-weight="700" fill="#111827">Ready to publish</text>
  <text x="222" y="542" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="14" fill="#475569">output/&lt;slug&gt;/</text>
  <g font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13.5" fill="#111827">
    <rect x="48" y="562" width="94" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="95" y="582" text-anchor="middle">final.mp4</text>
    <rect x="152" y="562" width="146" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="225" y="582" text-anchor="middle">final-shorts.mp4</text>
    <rect x="308" y="562" width="104" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="360" y="582" text-anchor="middle">capa-1.png</text>
    <rect x="422" y="562" width="104" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="474" y="582" text-anchor="middle">titulo.txt</text>
    <rect x="536" y="562" width="126" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="599" y="582" text-anchor="middle">descricao.txt</text>
    <rect x="672" y="562" width="126" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="735" y="582" text-anchor="middle">capitulos.txt</text>
    <rect x="808" y="562" width="118" height="30" rx="15" fill="#f8f8f2" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="867" y="582" text-anchor="middle">relatorio.md</text>
  </g>
</svg>

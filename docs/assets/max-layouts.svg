<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" role="img" aria-labelledby="m-title m-desc" font-family="'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="m-title">The layouts of the max editing level</title>
  <desc id="m-desc">Five miniature video frames. One: the presenter shrinks into a card on the right while a title and three cards fill a paper background (SplitExplainer). Two: a floating window with terminal lines and note pills, the presenter in the bottom right corner (WindowStage). Three: summary pills stacked over the full-frame footage, the last one in coral (PillStack). Four: a large serif phrase beside the presenter with one word in coral italics (PhraseReveal). Five: a paper scene entering over the footage through a torn paper edge (wipe tear). A sixth panel lists the seven required patterns and their minimums: summary pills 1.5 per minute, serif phrase 0.5 per minute, presenter card 1 per minute, split explainer 0.4 per minute, floating window 0.4 per minute, paper tear 0.5 per minute, highlighted quote 1 per video.</desc>
  <defs>
    <linearGradient id="m-footage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4a60"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <clipPath id="m-clip"><rect x="0" y="0" width="296" height="166" rx="14"/></clipPath>
    <clipPath id="m-card-v"><rect x="214" y="10" width="70" height="146" rx="10"/></clipPath>
    <clipPath id="m-pip"><rect x="222" y="94" width="64" height="62" rx="10"/></clipPath>
  </defs>

  <rect x="8" y="8" width="984" height="584" rx="24" fill="#f8f8f2" stroke="#e2e8f0" stroke-width="2"/>
  <text x="32" y="58" font-family="Georgia, 'Times New Roman', serif" font-size="27" font-weight="700" fill="#111827">The max level changes layout every 8–10 seconds</text>

  <!-- 1. presenter card + cards -->
  <g transform="translate(32 88)">
    <g clip-path="url(#m-clip)">
      <rect width="296" height="166" fill="#ffffff"/>
      <rect x="18" y="20" width="46" height="5" rx="2.5" fill="#94a3b8"/>
      <text x="18" y="50" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#111827">You customized</text>
      <text x="18" y="72" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#111827"><tspan fill="#ff5555" font-style="italic">how</tspan> it works</text>
      <g>
        <rect x="18" y="90" width="56" height="58" rx="8" fill="#f8f8f2" stroke="#cbd5e1"/>
        <circle cx="46" cy="110" r="9" fill="#111827"/>
        <rect x="28" y="130" width="36" height="5" rx="2.5" fill="#64748b"/>
        <rect x="82" y="90" width="56" height="58" rx="8" fill="#f8f8f2" stroke="#cbd5e1"/>
        <circle cx="110" cy="110" r="9" fill="#111827"/>
        <rect x="92" y="130" width="36" height="5" rx="2.5" fill="#64748b"/>
        <rect x="146" y="90" width="56" height="58" rx="8" fill="#f8f8f2" stroke="#cbd5e1"/>
        <circle cx="174" cy="110" r="9" fill="#111827"/>
        <rect x="156" y="130" width="36" height="5" rx="2.5" fill="#64748b"/>
      </g>
      <g clip-path="url(#m-card-v)">
        <rect x="214" y="10" width="70" height="146" fill="url(#m-footage)"/>
        <circle cx="249" cy="64" r="17" fill="#94a3b8"/>
        <path d="M214 156 C214 108 228 92 249 92 C270 92 284 108 284 156 Z" fill="#94a3b8"/>
      </g>
      <rect x="214" y="10" width="70" height="146" rx="10" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    </g>
    <rect width="296" height="166" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="192" font-size="15.5" font-weight="700" fill="#111827">Presenter in a card, content on paper</text>
    <text x="0" y="212" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#475569">SplitExplainer + presenter: right</text>
  </g>

  <!-- 2. floating window, presenter in the corner -->
  <g transform="translate(352 88)">
    <g clip-path="url(#m-clip)">
      <rect width="296" height="166" fill="#ffffff"/>
      <rect x="18" y="20" width="190" height="126" rx="10" fill="#0f172a" opacity="0.10"/>
      <rect x="16" y="16" width="190" height="126" rx="10" fill="#111827"/>
      <circle cx="30" cy="29" r="3.5" fill="#64748b"/>
      <circle cx="42" cy="29" r="3.5" fill="#64748b"/>
      <circle cx="54" cy="29" r="3.5" fill="#64748b"/>
      <line x1="16" y1="41" x2="206" y2="41" stroke="#334155"/>
      <path d="M28 55 l6 5 l-6 5" stroke="#ff5555" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="42" y="57" width="120" height="6" rx="3" fill="#f8f8f2"/>
      <rect x="28" y="77" width="150" height="6" rx="3" fill="#64748b"/>
      <rect x="28" y="93" width="110" height="6" rx="3" fill="#64748b"/>
      <path d="M28 117 l4 4 l8 -9" stroke="#34d399" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="46" y="113" width="92" height="6" rx="3" fill="#34d399"/>
      <rect x="216" y="22" width="68" height="20" rx="10" fill="#f8f8f2" stroke="#cbd5e1"/>
      <rect x="226" y="30" width="48" height="4" rx="2" fill="#475569"/>
      <rect x="216" y="50" width="54" height="20" rx="10" fill="#34d399"/>
      <rect x="226" y="58" width="34" height="4" rx="2" fill="#111827"/>
      <g clip-path="url(#m-pip)">
        <rect x="222" y="94" width="64" height="62" fill="url(#m-footage)"/>
        <circle cx="254" cy="118" r="12" fill="#94a3b8"/>
        <path d="M228 156 C228 140 240 134 254 134 C268 134 280 140 280 156 Z" fill="#94a3b8"/>
      </g>
      <rect x="222" y="94" width="64" height="62" rx="10" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    </g>
    <rect width="296" height="166" rx="14" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="0" y="192" font-size="15.5" font-weight="700" fill="#111827">Floating window, presenter in the corner</text>
    <text x="0" y="212" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#475569">WindowStage + presenter: pip-br</text>
  </g>

  <!-- 3. pills over the footage -->
  <g transform="translate(672 88)">
    <g clip-path="url(#m-clip)">
      <rect width="296" height="166" fill="url(#m-footage)"/>
      <circle cx="196" cy="74" r="27" fill="#94a3b8"/>
      <path d="M138 166 C138 126 162 110 196 110 C230 110 254 126 254 166 Z" fill="#94a3b8"/>
      <rect x="16" y="18" width="104" height="24" rx="12" fill="#f8f8f2"/>
      <text x="68" y="34.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111827">needs no code</text>
      <rect x="16" y="48" width="118" height="24" rx="12" fill="#34d399"/>
      <text x="75" y="64.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#111827">works with docs</text>
      <rect x="16" y="78" width="98" height="24" rx="12" fill="#ff5555"/>
      <text x="65" y="94.5" font-size="11.5" font-weight="700" text-anchor="middle" fill="#ffffff">the key idea</text>
      <rect x="98" y="142" width="100" height="8" rx="4" fill="#ffffff"/>
    </g>
    <rect width="296" height="166" rx="14" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="0" y="192" font-size="15.5" font-weight="700" fill="#111827">Summary pills over the footage</text>
    <text x="0" y="212" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#475569">PillStack (captions stay on)</text>
  </g>

  <!-- 4. serif phrase -->
  <g transform="translate(32 336)">
    <g clip-path="url(#m-clip)">
      <rect width="296" height="166" fill="url(#m-footage)"/>
      <circle cx="244" cy="62" r="27" fill="#94a3b8"/>
      <path d="M190 166 C190 126 214 98 244 98 C274 98 298 126 298 166 Z" fill="#94a3b8"/>
      <rect x="18" y="38" width="52" height="4" rx="2" fill="#cbd5e1"/>
      <text x="18" y="76" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#ffffff">Without opening</text>
      <text x="18" y="106" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-weight="700" fill="#ffffff">the <tspan fill="#ff5555" font-style="italic">terminal.</tspan></text>
    </g>
    <rect width="296" height="166" rx="14" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="0" y="192" font-size="15.5" font-weight="700" fill="#111827">Serif phrase beside the face</text>
    <text x="0" y="212" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#475569">PhraseReveal</text>
  </g>

  <!-- 5. paper scene entering through a tear -->
  <g transform="translate(352 336)">
    <g clip-path="url(#m-clip)">
      <rect width="296" height="166" fill="url(#m-footage)"/>
      <circle cx="244" cy="74" r="27" fill="#94a3b8"/>
      <path d="M186 166 C186 126 210 110 244 110 C278 110 296 126 300 166 Z" fill="#94a3b8"/>
      <!-- torn sheet: shadow, then paper -->
      <path d="M0 0 H196 L188 14 L198 28 L187 44 L197 60 L186 76 L196 92 L187 108 L198 124 L188 140 L196 154 L190 166 H0 Z" fill="#0f172a" opacity="0.35" transform="translate(5 0)"/>
      <path d="M0 0 H196 L188 14 L198 28 L187 44 L197 60 L186 76 L196 92 L187 108 L198 124 L188 140 L196 154 L190 166 H0 Z" fill="#ffffff"/>
      <!-- a small diagram on the paper -->
      <rect x="20" y="20" width="44" height="5" rx="2.5" fill="#94a3b8"/>
      <rect x="20" y="62" width="44" height="40" rx="8" fill="#f8f8f2" stroke="#cbd5e1"/>
      <rect x="29" y="79" width="26" height="5" rx="2.5" fill="#64748b"/>
      <path d="M68 82 H82" stroke="#64748b" stroke-width="2" fill="none"/>
      <path d="M82 82 l-5 -4 v8 z" fill="#64748b"/>
      <rect x="88" y="62" width="44" height="40" rx="8" fill="#111827"/>
      <rect x="97" y="79" width="26" height="5" rx="2.5" fill="#f8f8f2"/>
      <path d="M136 82 H150" stroke="#64748b" stroke-width="2" fill="none"/>
      <path d="M150 82 l-5 -4 v8 z" fill="#64748b"/>
      <circle cx="166" cy="82" r="12" fill="#ff5555"/>
      <rect x="20" y="124" width="120" height="5" rx="2.5" fill="#cbd5e1"/>
    </g>
    <rect width="296" height="166" rx="14" fill="none" stroke="#111827" stroke-width="1.5"/>
    <text x="0" y="192" font-size="15.5" font-weight="700" fill="#111827">Paper scene entering through a tear</text>
    <text x="0" y="212" font-family="Consolas, 'Cascadia Mono', Menlo, monospace" font-size="13" fill="#475569">scene:&lt;slug&gt;/&lt;Name&gt; + wipe: "tear"</text>
  </g>

  <!-- 6. required patterns -->
  <g transform="translate(672 336)">
    <rect width="296" height="222" rx="14" fill="#111827"/>
    <text x="18" y="32" font-size="15.5" font-weight="700" fill="#f8f8f2">Required in every max edit</text>
    <g font-size="13.5">
      <text x="18" y="62" fill="#cbd5e1">summary pills</text><text x="278" y="62" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 1.5 / min</text>
      <text x="18" y="86" fill="#cbd5e1">serif phrase</text><text x="278" y="86" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 0.5 / min</text>
      <text x="18" y="110" fill="#cbd5e1">presenter in a card</text><text x="278" y="110" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 1 / min</text>
      <text x="18" y="134" fill="#cbd5e1">split explainer</text><text x="278" y="134" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 0.4 / min</text>
      <text x="18" y="158" fill="#cbd5e1">floating window</text><text x="278" y="158" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 0.4 / min</text>
      <text x="18" y="182" fill="#cbd5e1">paper tear</text><text x="278" y="182" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 0.5 / min</text>
      <text x="18" y="206" fill="#cbd5e1">highlighted quote</text><text x="278" y="206" text-anchor="end" font-weight="700" fill="#f8f8f2">≥ 1 / video</text>
    </g>
  </g>
</svg>

[project]
name = "mchiodi-editor-transcriber"
version = "0.1.0"
description = "WhisperX sidecar: word-level transcription for MChiodi Editor"
requires-python = ">=3.12,<3.13"
dependencies = [
  "whisperx",
  "torch",
  "torchaudio",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
